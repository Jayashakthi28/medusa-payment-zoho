name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 11.5.1
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      # Vitest enforces these thresholds itself. This independent gate keeps the
      # 100% requirement visible in CI and catches a future threshold regression.
      - name: Enforce 100% coverage
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require("node:fs")
          const summary = JSON.parse(
            fs.readFileSync("coverage/coverage-summary.json", "utf8")
          )
          const metrics = ["lines", "statements", "functions", "branches"]
          const failures = metrics.filter(
            (metric) => summary.total[metric].pct !== 100
          )
          if (failures.length > 0) {
            for (const metric of failures) {
              console.error(
                `${metric}: ${summary.total[metric].pct}% (required 100%)`
              )
            }
            process.exit(1)
          }
          console.log(
            "Coverage is 100% for lines, statements, functions, and branches."
          )
          NODE

      - name: Build
        run: pnpm build

      - name: Check package contents
        run: pnpm pack:check

      - name: Verify published package shape
        run: pnpm verify:package

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
