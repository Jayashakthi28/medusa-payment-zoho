name: Release

# Only tags publish. Pushing a branch can never start this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 11.5.1
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # Keep npm new enough for Trusted Publishing after the first token-based
      # release. The token remains the bootstrap path until npmjs.com has a
      # trusted-publisher configuration for this package.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Run full release gate
        run: pnpm check

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the published version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          for attempt in 1 2 3 4 5; do
            if npm view "medusa-payment-zoho@${PACKAGE_VERSION}" version; then
              exit 0
            fi
            echo "npm has not exposed ${PACKAGE_VERSION} yet (attempt ${attempt}/5); retrying..."
            sleep 10
          done

          echo "::error::npm did not expose medusa-payment-zoho@${PACKAGE_VERSION} after publishing."
          exit 1
